raw_sources:
  piba:
    path: <RAW_ROOT>/piba
    # Use the MySQL database instead of an Excel dump
    db_config:
      host: localhost
      user: root
      password: 
      database: pibadb

base_path: <DATA_ROOT>

datasets: [piba]

# Set to an integer to subsample per‑dataset rows; leave null to use all
num_elements: null

# If you want to auto‑prepare a YOLO dataset after merging,
# set this to true and provide `prepare_config`.
prepare: false
# prepare_config: path/to/ultralytics_config.yaml

# Optional: include if you have negatives for PIBA
# negative_sources:
#   piba: <RAW_ROOT>/piba/negatives
