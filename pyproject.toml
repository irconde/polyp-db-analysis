[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polyp-db-analysis"
version = "0.1.0"
description = "Preprocess and merge polyp detection datasets"
authors = [{name = ""}]
dependencies = [
    "pillow",
    "matplotlib",
    "pandas",
    "numpy",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "scikit-image",
    "tifffile",
    "opencv-python-headless",
    "ImageHash",
    "paddlepaddle<3",
    "paddleocr<3"
]

[project.scripts]
polypdb = "polypdb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["polypdb"]
exclude = ["notebooks"]

